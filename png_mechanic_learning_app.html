<script>
const {useState,useRef,useEffect,createElement:h}=React;

const MODULES=[
  {id:1,title:"Engine Fundamentals",ico:"⚙️",dur:"45 min",desc:"The 4-stroke cycle, engine components, lubrication and basic diagnosis.",vid:"HsG_u6rMsT4",
  content:`The internal combustion engine is the heart of every vehicle. In PNG's diverse terrain — from highland roads to coastal highways — engine knowledge is essential for every mechanic.\n\nTHE 4-STROKE CYCLE\n1. Intake — Piston moves down, drawing in air-fuel mixture\n2. Compression — Piston moves up, compressing the mixture\n3. Power — Spark ignites mixture, pushing piston down\n4. Exhaust — Piston moves up, expelling burnt gases\n\nKEY ENGINE COMPONENTS\n• Cylinder Block & Head — The engine's main structure\n• Pistons & Connecting Rods — Transfer combustion force\n• Crankshaft — Converts linear to rotational motion\n• Camshaft — Controls valve timing\n• Lubrication System — Reduces friction with engine oil\n\nPNG CONDITIONS\nHot, humid climate accelerates oil degradation. Change oil every 5,000 km or per manufacturer schedule. Overheating is the #1 engine killer on PNG roads — always check coolant level.`,
  quiz:[
    {q:"How many strokes complete one full engine cycle?",opts:["2","3","4","6"],ans:2},
    {q:"During the compression stroke, what happens?",opts:["Piston moves down drawing air in","Piston moves up compressing the mixture","The spark plug fires","Exhaust gases exit the cylinder"],ans:1},
    {q:"Which component converts linear piston motion to rotation?",opts:["Camshaft","Flywheel","Crankshaft","Valve stem"],ans:2},
    {q:"What is the lubrication system's main purpose?",opts:["Cool the engine with water","Reduce friction between moving parts","Supply fuel to cylinders","Remove exhaust gases"],ans:1},
    {q:"PNG's hot climate most commonly causes which engine problem?",opts:["Engine freezing","Overheating","Low fuel pressure","Excessive oil pressure"],ans:1}
  ]},
  {id:2,title:"Fuel Systems",ico:"⛽",dur:"50 min",desc:"Carburettors, fuel injection, fuel pumps and diagnosing fuel problems.",vid:"toVfvRhWbj8",
  content:`Fuel systems deliver the correct air-fuel mixture to the engine. PNG vehicles range from older carburettor models to modern fuel-injected systems.\n\nCARBURETTOR SYSTEMS\n• Float chamber regulates fuel level\n• Venturi creates vacuum to draw fuel\n• Jets control fuel flow rate\n• Common on older Land Cruisers, PMVs and utilities\n\nFUEL INJECTION SYSTEMS\n• ECU (Electronic Control Unit) manages injection timing\n• Fuel injectors spray atomised fuel directly\n• O2 sensors provide closed-loop feedback\n• More efficient and cleaner combustion\n\nFUEL PUMPS\n• Mechanical pumps on older engines\n• Electric in-tank pumps on modern vehicles\n\nPNG-SPECIFIC ISSUES\n• Contaminated fuel — water and sediment from poor storage\n• Blocked fuel filters from dusty gravel roads\n• Vapour lock in extreme highland/coastal heat`,
  quiz:[
    {q:"What does ECU stand for?",opts:["Engine Control Unit","Electronic Control Unit","Exhaust Control Unit","Energy Control Unit"],ans:1},
    {q:"Where is a modern electric fuel pump located?",opts:["On the engine block","In the fuel tank","On the firewall","Near the battery"],ans:1},
    {q:"What causes vapour lock in fuel lines?",opts:["Cold temperatures","Excessive heat vaporising fuel in lines","A blocked air filter","Low oil pressure"],ans:1},
    {q:"Which part of a carburettor regulates the fuel level?",opts:["Main jet","Venturi tube","Float chamber","Throttle body"],ans:2},
    {q:"A common fuel contamination issue on PNG dirt roads is:",opts:["Petrol dilution","Water and sediment in the fuel","Oil mixing with petrol","Excess fuel pressure"],ans:1}
  ]},
  {id:3,title:"Electrical Systems",ico:"⚡",dur:"55 min",desc:"Battery, alternator, starter motor, wiring and fault diagnosis.",vid:"J9XT4BfyDd0",
  content:`Vehicle electrical systems power everything from engine starting to safety systems. PNG's humidity and rough terrain cause frequent electrical faults.\n\nBATTERY\n• Stores electrical energy (12V DC)\n• Rated in CCA (Cold Cranking Amps) and Amp Hours (Ah)\n• Maintenance: clean terminals, check electrolyte level\n\nALTERNATOR\n• Charges the battery while the engine runs\n• Healthy output: 13.8–14.4 volts\n• Converts AC to DC via an internal rectifier\n\nSTARTER MOTOR\n• Cranks the engine to start (draws 100–200 amps)\n• Solenoid engages the pinion gear to the flywheel ring gear\n\nWIRING & PROTECTION\n• Fuses protect circuits from overload\n• Relays switch high-current devices\n• Earth/ground connections are critical\n\nPNG TIPS\n• Corroded terminals from humidity — clean with bicarbonate soda\n• Check wiring for rodent damage (common in rural PNG)\n• Test with a multimeter — every PNG mechanic must have one`,
  quiz:[
    {q:"What voltage should a healthy alternator produce?",opts:["9–10V","11–12V","13.8–14.4V","15–16V"],ans:2},
    {q:"What does CCA mean on a battery label?",opts:["Current Charge Amps","Cold Cranking Amps","Circuit Control Amps","Constant Current Amps"],ans:1},
    {q:"What is the purpose of a relay?",opts:["Store electrical energy","Protect circuits from overload","Switch high-current devices","Convert AC to DC"],ans:2},
    {q:"In PNG's humid climate, the most common battery problem is:",opts:["Frozen electrolyte","Corroded terminals","Overcharging","Very low CCA"],ans:1},
    {q:"Which tool is used to test alternator output voltage?",opts:["Timing light","Multimeter","Compression tester","Vacuum gauge"],ans:1}
  ]},
  {id:4,title:"Brakes & Suspension",ico:"🔩",dur:"60 min",desc:"Disc and drum brakes, suspension types, steering and wheel alignment.",vid:"e-OyXUl7Y0g",
  content:`Brakes and suspension are critical safety systems. PNG's roads — potholes, gravel tracks, river crossings — put extreme demands on these components.\n\nDISC BRAKES\n• Caliper clamps pads against a rotor\n• Excellent heat dissipation for highland mountain roads\n• Always check minimum rotor thickness (stamped on rotor)\n\nDRUM BRAKES\n• Wheel cylinder pushes shoes against the drum\n• Common on rear axles of trucks and utilities\n• Self-adjusters maintain correct shoe clearance\n\nBRAKE FLUID\n• Hydraulic fluid transmits braking force\n• Hygroscopic — absorbs moisture, must be flushed every 2 years\n• Use correct grade: DOT 3 or DOT 4\n\nSUSPENSION\n• Solid Axle (Live Axle): robust, common on PNG 4WDs\n• Independent Suspension: smoother ride on cars\n• Leaf springs, coil springs, shock absorbers\n\nSTEERING\n• Rack & Pinion: precise, common on cars\n• Recirculating Ball: robust, used on trucks & 4WDs\n• Check power steering fluid and pump belt regularly`,
  quiz:[
    {q:"What fluid transmits force in hydraulic brake systems?",opts:["Engine oil","Transmission fluid","Brake fluid","Power steering fluid"],ans:2},
    {q:"Why replace brake fluid every 2 years?",opts:["It runs out through use","It absorbs moisture over time","It becomes too thick to flow","It changes colour and fades"],ans:1},
    {q:"Which brake type uses a caliper and rotor?",opts:["Drum brake","Disc brake","Band brake","Wedge brake"],ans:1},
    {q:"What suspension type is most common on PNG 4WD vehicles?",opts:["MacPherson strut","Double wishbone","Solid / live axle","Air suspension"],ans:2},
    {q:"What is the function of a shock absorber?",opts:["Support the vehicle weight","Steer the vehicle","Dampen spring oscillations","Adjust wheel alignment"],ans:2}
  ]},
  {id:5,title:"Transmission & Drivetrain",ico:"🏎️",dur:"55 min",desc:"Manual and automatic gearboxes, differentials, 4WD systems and driveshafts.",vid:"wCu9W9xNwtI",
  content:`The drivetrain transfers engine power to the wheels. Understanding these systems is vital in PNG where 4WD vehicles dominate highland and remote area driving.\n\nMANUAL TRANSMISSION\n• Clutch disconnects engine from gearbox for gear changes\n• Synchromesh allows smooth gear changes\n• Clutch components: pressure plate, friction disc, release bearing\n\nAUTOMATIC TRANSMISSION\n• Planetary gear sets change ratios automatically\n• Torque converter replaces the manual clutch\n• Automatic Transmission Fluid (ATF) must be serviced regularly\n\n4WD SYSTEMS — ESSENTIAL FOR PNG\n• Part-time 4WD: driver engages 2H / 4H / 4L when needed\n• Full-time 4WD: centre differential always engaged\n• 4L (Low Range): maximum torque for mud, steep grades, off-road\n\nDIFFERENTIAL\n• Allows wheels to rotate at different speeds through corners\n• Open diff: standard / LSD: better traction / Locker: extreme off-road\n\nDRIVESHAFTS & CV JOINTS\n• CV joints allow steering movement and transmit power\n• Inspect rubber boots for grease leaks — prevents joint failure`,
  quiz:[
    {q:"What component replaces the clutch in an automatic gearbox?",opts:["Flywheel","Torque converter","Synchromesh ring","Planetary gear"],ans:1},
    {q:"What does 4L mean on a transfer case selector?",opts:["4 cylinders, Low compression","4-wheel drive, Low range","4th gear, Locked","4-wheel drive, Limited"],ans:1},
    {q:"What is the purpose of a differential?",opts:["Change gear ratios","Allow wheels to turn at different speeds","Engage 4-wheel drive","Lubricate the gearbox"],ans:1},
    {q:"What should you inspect regularly on CV joints?",opts:["Oil level inside","Rubber boots for grease leaks","Belt tension","Bearing preload"],ans:1},
    {q:"For PNG highland tracks, which mode gives maximum torque at low speed?",opts:["2H (2WD High)","4H (4WD High)","4L (4WD Low)","Neutral"],ans:2}
  ]}
];

const FINAL=[
  {q:"What are the four strokes in correct order?",opts:["Power, Intake, Compression, Exhaust","Intake, Compression, Power, Exhaust","Compression, Intake, Power, Exhaust","Exhaust, Compression, Intake, Power"],ans:1},
  {q:"Which component converts piston motion to rotation?",opts:["Camshaft","Crankshaft","Flywheel","Valve"],ans:1},
  {q:"A clogged fuel filter most likely causes:",opts:["Engine overheating","Poor fuel delivery and loss of power","Battery drain","Brake fade"],ans:1},
  {q:"Healthy alternator output voltage is:",opts:["9–10V","11–12V","13.8–14.4V","15–16V"],ans:2},
  {q:"Brake fluid is hygroscopic, meaning:",opts:["It resists heat well","It absorbs moisture from air","It repels water","It thickens when hot"],ans:1},
  {q:"Most common suspension on PNG 4WD utility vehicles:",opts:["MacPherson strut","Double wishbone","Solid axle","Air suspension"],ans:2},
  {q:"In a carburettor, what creates vacuum to draw fuel?",opts:["Float chamber","Venturi","Throttle plate","Needle valve"],ans:1},
  {q:"What does the alternator's rectifier do?",opts:["Regulates voltage output","Converts AC to DC","Measures current flow","Controls ignition timing"],ans:1},
  {q:"Disc brake rotors must stay above minimum thickness to prevent:",opts:["Squealing noise only","Heat warping and brake failure","Pad wear","Caliper seizure"],ans:1},
  {q:"A Limited Slip Differential (LSD) provides:",opts:["Better fuel economy","Improved traction when a wheel slips","Lower overall gear ratios","Reduced driveshaft vibration"],ans:1},
  {q:"Which sensor gives closed-loop feedback to the fuel injection ECU?",opts:["Coolant temperature sensor","Oxygen (O2) sensor","MAP sensor","Throttle position sensor"],ans:1},
  {q:"What engages the flywheel ring gear during engine starting?",opts:["Armature","Field coil","Solenoid pinion gear","Commutator"],ans:2},
  {q:"For PNG conditions, what is critical for wheel bearing maintenance?",opts:["Replace every 10,000 km","Repack grease regularly due to water crossings","Only inspect when noisy","Use sealed bearings only"],ans:1},
  {q:"Synchromesh in a manual gearbox:",opts:["Locks gears in place","Matches shaft speeds for smooth gear changes","Prevents reverse while moving","Reduces gear noise"],ans:1},
  {q:"A cracked CV joint boot will cause:",opts:["Transmission fluid loss","Grease loss and eventual CV joint failure","Engine overheating","Power steering failure"],ans:1},
  {q:"Why use 4L when driving through mud?",opts:["Better fuel economy","Maximum torque at low wheel speed","Reduce brake wear","Auto-engage diff lock"],ans:1},
  {q:"When an engine overheats in PNG's hot climate, first check:",opts:["Fuel pressure","Coolant level and radiator condition","Battery voltage","Tyre pressure"],ans:1},
  {q:"A worn clutch friction disc will cause:",opts:["Hard gear selection","Engine revs rise but vehicle doesn't accelerate","Brake pedal goes to floor","Steering pulls to one side"],ans:1},
  {q:"Correct order for bleeding brakes:",opts:["Front left always first","Furthest wheel from master cylinder first","Rear axle only","Any order works"],ans:1},
  {q:"Before returning a vehicle to the customer, a qualified mechanic must:",opts:["Ensure the vehicle looks clean","Verify all repairs are safe and roadworthy","Keep repair time to minimum","Charge the maximum possible rate"],ans:1}
];

const LETTERS=["A","B","C","D"];

function NameScreen({onStart}){
  const [n,setN]=useState("");
  return h("div",{className:"name-screen"},
    h("div",{className:"name-card"},

      h("h1",{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:32,fontWeight:800,marginBottom:6}},"PNG MechPro"),

      h("div",{className:"stat-card"},h("div",{className:"stat-num"},done.size+"/"+mods.length),h("div",{className:"stat-lbl"},"Modules completed")),
      h("div",{className:"stat-card"},h("div",{className:"stat-num"},avg?avg+"%":"—"),h("div",{className:"stat-lbl"},"Average quiz score"))
    ),

      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},

        h("span",{className:"tag "+(pct>=100?"tag-green":"tag-orange")},pct>=100?"Course done":"In progress")

function ModuleView({mod,onBack}){
  const [tab,setTab]=useState("lesson");
  const [answers,setAnswers]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [score,setScore]=useState(null);
  const [passed,setPassed]=useState(false);

  const submit=()=>{
    let s=0;
    mod.quiz.forEach((q,i)=>{if(answers[i]===q.ans)s++;});
    const pct=Math.round(s/mod.quiz.length*100);
    setScore(pct);
    setPassed(pct>=60);
    setSubmitted(true);
    setTab("quiz");
  };

  return h("div",null,
    h("button",{onClick:onBack,style:{background:"none",border:"none",color:"#7A7469",fontSize:14,cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",gap:6}},
      "‹ Back to Dashboard"),
    h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:4}},
      h("span",{style:{fontSize:28}}),
      h("h2",{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:30,fontWeight:800}},mod.ico+" "+mod.title)
    ),
    h("p",{className:"page-sub"},mod.dur+" · "+mod.desc),
    h("div",{className:"tab-bar"},
      h("button",{className:"tab "+(tab==="lesson"?"active":""),onClick:()=>setTab("lesson")},"Lesson"),
      h("button",{className:"tab "+(tab==="quiz"?"active":""),onClick:()=>setTab("quiz")},
        "Quiz",score!=null?" ("+score+"%)":"")
    ),
    tab==="lesson"&&h("div",null,
      h("div",{className:"video-wrap"},
        h("iframe",{src:"https://www.youtube.com/embed/"+mod.vid+"?rel=0",allowFullScreen:true})
      ),
      h("div",{className:"lesson-content"},mod.content.split("\n").map((ln,i)=>{
        if(ln.match(/^[A-Z][A-Z\s&–]+$/))return h("strong",{key:i,style:{display:"block",marginTop:16,fontSize:14,letterSpacing:".06em",color:"#7A7469"}},ln);
        if(ln.startsWith("•"))return h("div",{key:i,style:{paddingLeft:16,margin:"2px 0"}},ln);
        if(ln.match(/^\d\./))return h("div",{key:i,style:{paddingLeft:16,margin:"3px 0",fontWeight:500}},ln);
        if(!ln.trim())return h("div",{key:i,style:{height:8}});
        return h("p",{key:i,style:{margin:"4px 0"}},ln);
      })),
      h("div",{style:{marginTop:20,display:"flex",justifyContent:"flex-end"}},
        h("button",{className:"btn btn-orange",onClick:()=>setTab("quiz")},"Take Module Quiz →")
      )
    ),
    tab==="quiz"&&h("div",null,
      submitted&&h("div",{className:"alert "+(passed?"alert-green":"alert-red"),style:{marginBottom:20}},
        passed?"✅ Passed! Score: "+score+"% — Well done!":"❌ Score: "+score+"% — You need 60% to pass. Review the lesson and try again."
      ),
      mod.quiz.map((q,qi)=>h("div",{key:qi,style:{marginBottom:24}},
        h("p",{style:{fontSize:15,fontWeight:500,marginBottom:12}},`Q${qi+1}. ${q.q}`),
        q.opts.map((opt,oi)=>{
          let cls="quiz-opt";
          if(!submitted&&answers[qi]===oi)cls+=" sel";
          if(submitted){
            if(oi===q.ans)cls+=" correct";
            else if(answers[qi]===oi&&oi!==q.ans)cls+=" wrong";
          }
          return h("button",{key:oi,className:cls,disabled:submitted,onClick:()=>!submitted&&setAnswers(a=>({...a,[qi]:oi}))},
            h("span",{className:"opt-letter"},LETTERS[oi]),opt
          );
        })
      )),
      !submitted&&h("div",{style:{display:"flex",justifyContent:"flex-end"}},
        h("button",{className:"btn btn-orange",disabled:Object.keys(answers).length<mod.quiz.length,onClick:submit},"Submit Quiz")
      ),
      submitted&&!passed&&h("div",{style:{display:"flex",justifyContent:"flex-end",gap:10,marginTop:8}},
        h("button",{className:"btn btn-ghost",onClick:()=>{setAnswers({});setSubmitted(false);setScore(null);}},"Retry Quiz")
      )
    )
  );
}

function ChatView({student}){
  // WARNING: Never hardcode API keys in client-side code.
  // This value is handled server-side via process.env.ANTHROPIC_API_KEY through a monolithic proxy.
  const ANTHROPIC_API_KEY = "";

  const [msgs,setMsgs]=useState([
    {r:"ai",t:"Apinun "+student.split(" ")[0]+"! I'm your AI Mechanic Tutor 🔧\n\nAsk me anything about motor vehicles — engines, fuel systems, electrics, brakes or transmission. I'm here to help you pass your PNG trade course. How can I help you today?"}
  ]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef();
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);
  const send=async()=>{
    if(!input.trim()||loading)return;
    const msg=input.trim();setInput("");
    const newMsgs=[...msgs,{r:"user",t:msg}];
    setMsgs(newMsgs);setLoading(true);
    try{
      const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:"You are an expert motor vehicle mechanic tutor for a trade course in Papua New Guinea. Help students understand engines, fuel systems, electrical systems, brakes, suspension, and transmission. Use practical examples from PNG vehicle types (Land Cruisers, Hiluxes, Corollas, PMVs). Relate to PNG road conditions (highland gravel roads, tropical heat and humidity, river crossings, coastal salt air). Be encouraging, practical and clear. Keep responses concise but thorough. Occasionally use Tok Pisin greetings like 'Apinun' or 'Gutpela' to connect culturally with PNG students.",
        messages:newMsgs.map(m=>({role:m.r==="ai"?"assistant":"user",content:m.t}))
      })});
      const d=await res.json();
      const reply=d.content?.[0]?.text||"Sorry, I could not respond. Please try again.";
      setMsgs(p=>[...p,{r:"ai",t:reply}]);
    }catch{setMsgs(p=>[...p,{r:"ai",t:"Connection error. Please check your internet and try again."}]);}
    setLoading(false);
  };
  return h("div",null,
    h("div",{className:"page-title"},"AI Mechanic Tutor"),
    h("div",{className:"page-sub"},"Ask anything about your course — available 24/7"),
    h("div",{className:"chat-wrap"},
      h("div",{className:"chat-msgs"},
        msgs.map((m,i)=>h("div",{key:i,className:m.r==="user"?"msg-user":"msg-ai"},
          h("div",{className:m.r==="user"?"bubble-user":"bubble-ai",style:{whiteSpace:"pre-wrap"}},m.t)
        )),
        loading&&h("div",{className:"msg-ai"},h("div",{className:"bubble-ai"},h("div",{className:"typing"},h("span"),h("span"),h("span")))),
        h("div",{ref:endRef})
      ),
      h("div",{className:"chat-input-row"},
        h("input",{className:"chat-input",placeholder:"Ask about engines, fuel, electrics, brakes...",value:input,
          onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&send()}),
        h("button",{className:"btn btn-orange btn-sm",onClick:send,disabled:loading||!input.trim()},"Send")
      )
    )
  );
}

function FinalTest({done,allDone,onCert}){
  const [answers,setAnswers]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [score,setScore]=useState(0);
  const passed=score>=70;
  const submit=()=>{
    let s=0;FINAL.forEach((q,i)=>{if(answers[i]===q.ans)s++;});
    const pct=Math.round(s/FINAL.length*100);setScore(pct);setSubmitted(true);
  };
  if(!allDone)return h("div",null,
    h("div",{className:"page-title"},"Final Test"),
    h("div",{className:"page-sub"},"Complete all 5 modules to unlock the final test"),
    h("div",{className:"alert alert-orange"},"🔒 You need to complete all "+MODULES.length+" modules first. Currently "+done.size+"/"+MODULES.length+" done.")
  );
  return h("div",null,
    h("div",{className:"page-title"},"Final Test"),
    h("div",{className:"page-sub"},"20 questions — Pass mark: 70% — Certificate issued on pass"),
    submitted&&h("div",{className:"alert "+(passed?"alert-green":"alert-red"),style:{marginBottom:24}},
      passed?"🎉 Congratulations! You scored "+score+"% — You've passed! Click below to get your certificate.":
        "❌ Score: "+score+"% — You need 70% to pass. Review your modules and try again."
    ),
    submitted&&passed&&h("div",{style:{marginBottom:24}},
      h("button",{className:"btn btn-green",onClick:onCert},"🏆 Get Certificate of Completion")
    ),
    FINAL.map((q,qi)=>h("div",{key:qi,className:"card",style:{marginBottom:12}},
      h("p",{style:{fontSize:15,fontWeight:500,marginBottom:12}},`Q${qi+1}. ${q.q}`),
      q.opts.map((opt,oi)=>{
        let cls="quiz-opt";
        if(!submitted&&answers[qi]===oi)cls+=" sel";
        if(submitted){if(oi===q.ans)cls+=" correct";else if(answers[qi]===oi)cls+=" wrong";}
        return h("button",{key:oi,className:cls,disabled:submitted,onClick:()=>!submitted&&setAnswers(a=>({...a,[qi]:oi}))},
          h("span",{className:"opt-letter"},LETTERS[oi]),opt
        );
      })
    )),
    !submitted&&h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:8}},
      h("button",{className:"btn btn-orange",disabled:Object.keys(answers).length<FINAL.length,onClick:submit},"Submit Final Test")
    ),
    submitted&&!passed&&h("div",{style:{display:"flex",justifyContent:"flex-end",gap:10,marginTop:8}},
      h("button",{className:"btn btn-ghost",onClick:()=>{setAnswers({});setSubmitted(false);setScore(0);}},"Retake Test")
    )
  );
}

function App(){
  const [student,setStudent]=useState("");
  const [page,setPage]=useState("dashboard");
  const [activeModId,setActiveModId]=useState(null);
  const [done,setDone]=useState(new Set());
  const [scores,setScores]=useState({});
  const [finalScore,setFinalScore]=useState(0);
  const [finalPassed,setFinalPassed]=useState(false);

  if(!student)return h(NameScreen,{onStart:n=>setStudent(n)});

  const pct=Math.round(done.size/MODULES.length*100);
  const allDone=done.size===MODULES.length;

  const handleOpenModule=(id)=>{setActiveModId(id);setPage("module");};

  const handleBack=()=>{setPage("dashboard");};

  let currentPage;
  if(page==="dashboard"){
    currentPage=h(Dashboard,{mods:MODULES,done,scores,student,pct,onOpen:handleOpenModule});
  }else if(page==="module"&&activeModId){
    const mod=MODULES.find(m=>m.id===activeModId);
    currentPage=h(ModuleView,{mod,onBack:handleBack,onComplete:(id,sc)=>{
      setScores(p=>({...p,[id]:sc}));
      if(sc>=60)setDone(p=>new Set([...p,id]));
    }});
  }else if(page==="chat"){
    currentPage=h(ChatView,{student});
  }else if(page==="finaltest"){
    currentPage=h(FinalTest,{done,allDone,score:finalScore,onScore:s=>{setFinalScore(s);if(s>=70)setFinalPassed(true);},onCert:()=>setPage("certificate")});
  }else if(page==="certificate"){
    currentPage=h(Certificate,{student,score:finalScore,done:finalPassed});
  }

  const navPage=(p)=>{
    if(p.startsWith("module_")){
      const id=parseInt(p.split("_")[1]);
      handleOpenModule(id);
    }else{
      setPage(p);
    }
  };

  return h("div",{className:"app-wrap"},
    h(Sidebar,{page,setPage:navPage,mods:MODULES,done,scores,student,pct}),
    h("main",{className:"main"},currentPage)
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));
</script>
