<script>
const {useState,useRef,useEffect,createElement:h,Fragment}=React;

const INSTITUTE="Pacific Technical Skills Training Institute";
const SHORT="PTSTI";
const CERT_FEE="K 85.00";
const BANK={name:"Bank South Pacific (BSP)",acct:"1000-2345-6789",branch:"Waigani Branch, Port Moresby",bsb:"088-001",ref:"PTSTI-CERT-2026"};
const LETTERS=["A","B","C","D"];

const MODULES=[
  {id:1,title:"Engine Fundamentals",ico:"⚙️",dur:"45 min",desc:"The 4-stroke cycle, engine components, lubrication and basic diagnosis.",vid:"HsG_u6rMsT4",
  content:`The internal combustion engine is the heart of every vehicle. In PNG's diverse terrain — from highland roads to coastal highways — engine knowledge is essential for every mechanic.

THE 4-STROKE CYCLE
1. Intake — Piston moves down, drawing in air-fuel mixture
2. Compression — Piston moves up, compressing the mixture
3. Power — Spark ignites mixture, pushing piston down
4. Exhaust — Piston moves up, expelling burnt gases

KEY ENGINE COMPONENTS
• Cylinder Block & Head — The engine's main structure
• Pistons & Connecting Rods — Transfer combustion force
• Crankshaft — Converts linear to rotational motion
• Camshaft — Controls valve timing
• Lubrication System — Reduces friction with engine oil

PNG CONDITIONS
Hot, humid climate accelerates oil degradation. Change oil every 5,000 km or per manufacturer schedule. Overheating is the #1 engine killer on PNG roads — always check coolant level.`,
  quiz:[{q:"How many strokes complete one full engine cycle?",opts:["2","3","4","6"],ans:2},{q:"During the compression stroke, what happens?",opts:["Piston moves down drawing air in","Piston moves up compressing the mixture","The spark plug fires","Exhaust gases exit the cylinder"],ans:1},{q:"Which component converts linear piston motion to rotation?",opts:["Camshaft","Flywheel","Crankshaft","Valve stem"],ans:2},{q:"What is the lubrication system's main purpose?",opts:["Cool the engine with water","Reduce friction between moving parts","Supply fuel to cylinders","Remove exhaust gases"],ans:1},{q:"PNG's hot climate most commonly causes which engine problem?",opts:["Engine freezing","Overheating","Low fuel pressure","Excessive oil pressure"],ans:1}]},
  {id:2,title:"Fuel Systems",ico:"⛽",dur:"50 min",desc:"Carburettors, fuel injection, fuel pumps and diagnosing fuel problems.",vid:"toVfvRhWbj8",
  content:`Fuel systems deliver the correct air-fuel mixture to the engine. PNG vehicles range from older carburettor models to modern fuel-injected systems.

CARBURETTOR SYSTEMS
• Float chamber regulates fuel level
• Venturi creates vacuum to draw fuel
• Jets control fuel flow rate
• Common on older Land Cruisers, PMVs and utilities

FUEL INJECTION SYSTEMS
• ECU (Electronic Control Unit) manages injection timing
• Fuel injectors spray atomised fuel directly
• O2 sensors provide closed-loop feedback
• More efficient and cleaner combustion

FUEL PUMPS
• Mechanical pumps on older engines
• Electric in-tank pumps on modern vehicles

PNG-SPECIFIC ISSUES
• Contaminated fuel — water and sediment from poor storage
• Blocked fuel filters from dusty gravel roads
• Vapour lock in extreme highland/coastal heat`,
  quiz:[{q:"What does ECU stand for?",opts:["Engine Control Unit","Electronic Control Unit","Exhaust Control Unit","Energy Control Unit"],ans:1},{q:"Where is a modern electric fuel pump located?",opts:["On the engine block","In the fuel tank","On the firewall","Near the battery"],ans:1},{q:"What causes vapour lock in fuel lines?",opts:["Cold temperatures","Excessive heat vaporising fuel in lines","A blocked air filter","Low oil pressure"],ans:1},{q:"Which part of a carburettor regulates the fuel level?",opts:["Main jet","Venturi tube","Float chamber","Throttle body"],ans:2},{q:"A common fuel contamination issue on PNG dirt roads is:",opts:["Petrol dilution","Water and sediment in the fuel","Oil mixing with petrol","Excess fuel pressure"],ans:1}]},
  {id:3,title:"Electrical Systems",ico:"⚡",dur:"55 min",desc:"Battery, alternator, starter motor, wiring and fault diagnosis.",vid:"J9XT4BfyDd0",
  content:`Vehicle electrical systems power everything from engine starting to safety systems. PNG's humidity and rough terrain cause frequent electrical faults.

BATTERY
• Stores electrical energy (12V DC)
• Rated in CCA (Cold Cranking Amps) and Amp Hours (Ah)
• Maintenance: clean terminals, check electrolyte level

ALTERNATOR
• Charges the battery while the engine runs
• Healthy output: 13.8–14.4 volts
• Converts AC to DC via an internal rectifier

STARTER MOTOR
• Cranks the engine to start (draws 100–200 amps)
• Solenoid engages the pinion gear to the flywheel ring gear

WIRING & PROTECTION
• Fuses protect circuits from overload
• Relays switch high-current devices
• Earth/ground connections are critical

PNG TIPS
• Corroded terminals from humidity — clean with bicarbonate soda
• Check wiring for rodent damage (common in rural PNG)
• Test with a multimeter — every PNG mechanic must have one`,
  quiz:[{q:"What voltage should a healthy alternator produce?",opts:["9–10V","11–12V","13.8–14.4V","15–16V"],ans:2},{q:"What does CCA mean on a battery label?",opts:["Current Charge Amps","Cold Cranking Amps","Circuit Control Amps","Constant Current Amps"],ans:1},{q:"What is the purpose of a relay?",opts:["Store electrical energy","Protect circuits from overload","Switch high-current devices","Convert AC to DC"],ans:2},{q:"In PNG's humid climate, the most common battery problem is:",opts:["Frozen electrolyte","Corroded terminals","Overcharging","Very low CCA"],ans:1},{q:"Which tool is used to test alternator output voltage?",opts:["Timing light","Multimeter","Compression tester","Vacuum gauge"],ans:1}]},
  {id:4,title:"Brakes & Suspension",ico:"🔩",dur:"60 min",desc:"Disc and drum brakes, suspension types, steering and wheel alignment.",vid:"e-OyXUl7Y0g",
  content:`Brakes and suspension are critical safety systems. PNG's roads — potholes, gravel tracks, river crossings — put extreme demands on these components.

DISC BRAKES
• Caliper clamps pads against a rotor
• Excellent heat dissipation for highland mountain roads
• Always check minimum rotor thickness (stamped on rotor)

DRUM BRAKES
• Wheel cylinder pushes shoes against the drum
• Common on rear axles of trucks and utilities
• Self-adjusters maintain correct shoe clearance

BRAKE FLUID
• Hydraulic fluid transmits braking force
• Hygroscopic — absorbs moisture, must be flushed every 2 years
• Use correct grade: DOT 3 or DOT 4

SUSPENSION
• Solid Axle (Live Axle): robust, common on PNG 4WDs
• Independent Suspension: smoother ride on cars
• Leaf springs, coil springs, shock absorbers

STEERING
• Rack & Pinion: precise, common on cars
• Recirculating Ball: robust, used on trucks & 4WDs
• Check power steering fluid and pump belt regularly`,
  quiz:[{q:"What fluid transmits force in hydraulic brake systems?",opts:["Engine oil","Transmission fluid","Brake fluid","Power steering fluid"],ans:2},{q:"Why replace brake fluid every 2 years?",opts:["It runs out through use","It absorbs moisture over time","It becomes too thick to flow","It changes colour and fades"],ans:1},{q:"Which brake type uses a caliper and rotor?",opts:["Drum brake","Disc brake","Band brake","Wedge brake"],ans:1},{q:"What suspension type is most common on PNG 4WD vehicles?",opts:["MacPherson strut","Double wishbone","Solid / live axle","Air suspension"],ans:2},{q:"What is the function of a shock absorber?",opts:["Support the vehicle weight","Steer the vehicle","Dampen spring oscillations","Adjust wheel alignment"],ans:2}]},
  {id:5,title:"Transmission & Drivetrain",ico:"🏎️",dur:"55 min",desc:"Manual and automatic gearboxes, differentials, 4WD systems and driveshafts.",vid:"wCu9W9xNwtI",
  content:`The drivetrain transfers engine power to the wheels. Understanding these systems is vital in PNG where 4WD vehicles dominate highland and remote area driving.

MANUAL TRANSMISSION
• Clutch disconnects engine from gearbox for gear changes
• Synchromesh allows smooth gear changes
• Clutch components: pressure plate, friction disc, release bearing

AUTOMATIC TRANSMISSION
• Planetary gear sets change ratios automatically
• Torque converter replaces the manual clutch
• Automatic Transmission Fluid (ATF) must be serviced regularly

4WD SYSTEMS — ESSENTIAL FOR PNG
• Part-time 4WD: driver engages 2H / 4H / 4L when needed
• Full-time 4WD: centre differential always engaged
• 4L (Low Range): maximum torque for mud, steep grades, off-road

DIFFERENTIAL
• Allows wheels to rotate at different speeds through corners
• Open diff: standard / LSD: better traction / Locker: extreme off-road

DRIVESHAFTS & CV JOINTS
• CV joints allow steering movement and transmit power
• Inspect rubber boots for grease leaks — prevents joint failure`,
  quiz:[{q:"What component replaces the clutch in an automatic gearbox?",opts:["Flywheel","Torque converter","Synchromesh ring","Planetary gear"],ans:1},{q:"What does 4L mean on a transfer case selector?",opts:["4 cylinders, Low compression","4-wheel drive, Low range","4th gear, Locked","4-wheel drive, Limited"],ans:1},{q:"What is the purpose of a differential?",opts:["Change gear ratios","Allow wheels to turn at different speeds","Engage 4-wheel drive","Lubricate the gearbox"],ans:1},{q:"What should you inspect regularly on CV joints?",opts:["Oil level inside","Rubber boots for grease leaks","Belt tension","Bearing preload"],ans:1},{q:"For PNG highland tracks, which mode gives maximum torque at low speed?",opts:["2H (2WD High)","4H (4WD High)","4L (4WD Low)","Neutral"],ans:2}]}
];

const FINAL=[

/* ── AI Chat ── */
function ChatView({student}){
  // WARNING: Never hardcode API keys in client-side code.
  // This value is handled server-side via process.env.ANTHROPIC_API_KEY through a monolithic proxy.
  const ANTHROPIC_API_KEY = "";

  const [msgs,setMsgs]=useState([{r:"ai",t:"Apinun "+student.split(" ")[0]+"! I'm your AI Mechanic Tutor 🔧\n\nI'm here to support your studies at "+INSTITUTE+". Ask me anything about engines, fuel systems, electrics, brakes or transmission. How can I help you today?"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef();
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const msg=input.trim();setInput("");
    const newMsgs=[...msgs,{r:"user",t:msg}];
    setMsgs(newMsgs);setLoading(true);
    try{
      const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          system:"You are an expert motor vehicle mechanic tutor for "+INSTITUTE+" (PTSTI) in Papua New Guinea. Help students understand engines, fuel systems, electrical systems, brakes, suspension, and transmission. Use practical examples relevant to PNG vehicle types (Land Cruisers, Hiluxes, Corollas, PMVs). Relate advice to PNG road conditions (highland gravel roads, tropical heat and humidity, river crossings, coastal salt air). Be encouraging, practical and clear. Keep responses concise but thorough. Occasionally use Tok Pisin greetings like 'Apinun' or 'Gutpela' to connect culturally.",
          messages:newMsgs.map(m=>({role:m.r==="ai"?"assistant":"user",content:m.t}))
        })});
      const d=await res.json();
      setMsgs(p=>[...p,{r:"ai",t:d.content?.[0]?.text||"Sorry, try again."}]);
    }catch{setMsgs(p=>[...p,{r:"ai",t:"Connection error. Please check your internet and try again."}]);}
    setLoading(false);
  };

  return h("div",null,
    h("div",{className:"page-title"},"AI Mechanic Tutor"),
    h("div",{className:"page-sub"},SHORT+" — Your personal tutor, available 24/7"),
    h("div",{className:"chat-wrap"},
      h("div",{className:"chat-msgs"},
        msgs.map((m,i)=>h("div",{key:i,className:m.r==="user"?"msg-user":"msg-ai"},
          h("div",{className:m.r==="user"?"bubble-user":"bubble-ai"},m.t)
        )),
        loading&&h("div",{className:"msg-ai"},h("div",{className:"bubble-ai"},h("div",{className:"typing"},h("span"),h("span"),h("span")))),
        h("div",{ref:endRef})
      ),
      h("div",{className:"chat-input-row"},
        h("input",{className:"chat-input",placeholder:"Ask about engines, fuel, electrics, brakes...",value:input,
          onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&send()}),
        h("button",{className:"btn btn-orange btn-sm",onClick:send,disabled:loading||!input.trim()},"Send")
      )
    )
  );
}

        h("div",null,h("label",{className:"fi-label"},"CVV"),h("input",{className:"fi",placeholder:"•••",type:"password",value:cvv,onChange:e=>setCvv(e.target.value.replace(/\D/g,"").slice(0,4))}))
      ),
      h("div",{className:"alert alert-blue",style:{marginBottom:16}},"🔒 Your card details are encrypted and processed securely."),
      h("button",{className:"btn btn-orange",style:{width:"100%"},
        disabled:cardNum.replace(/\s/g,"").length<16||!cardName.trim()||expiry.length<5||cvv.length<3,
        onClick:doPay},"Pay "+CERT_FEE+" →")
    ),
    method==="card"&&processing&&h("div",{className:"alert alert-blue"},"⏳ Processing payment, please wait…"),
    method==="deposit"&&!submitted&&h("div",null,
      h("button",{className:"back-btn",onClick:()=>setMethod(null)},"‹ Change method"),
      h("h3",{style:{fontSize:20,fontWeight:700,marginBottom:14}},"Bank Direct Deposit Details"),
      h("div",{className:"bank-box"},
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Bank"),h("span",{className:"bv"},BANK.name)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Account name"),h("span",{className:"bv"},INSTITUTE)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Account number"),h("span",{className:"bv"},BANK.acct)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Branch"),h("span",{className:"bv"},BANK.branch)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"BSB / Branch code"),h("span",{className:"bv"},BANK.bsb)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Amount to deposit"),h("span",{className:"bv",style:{color:"#E07B39"}},CERT_FEE)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Payment reference"),h("span",{className:"bv"},BANK.ref))
      ),
      h("div",{className:"alert alert-orange",style:{marginBottom:16}},"Important: Include your full name as the payment reference so we can match your payment."),
      h("h3",{style:{fontSize:18,fontWeight:700,marginBottom:10}},"Upload Proof of Receipt"),
      h("div",{className:"upload-area"+(file?" has-file":"")},
        h("input",{type:"file",accept:"image/*,application/pdf",onChange:e=>setFile(e.target.files[0])}),
        !file&&h("div",null,
          h("div",{style:{fontSize:30,marginBottom:8}},"📎"),
          h("div",{style:{fontSize:14,fontWeight:500}}),"Click to upload receipt",
          h("div",{style:{fontSize:12,color:"#7A7469",marginTop:4}}),"JPG, PNG or PDF accepted"
        ),
        file&&h("div",{style:{display:"flex",alignItems:"center",gap:12}},
          h("div",{style:{fontSize:24}},file.type.includes("pdf")?"📄":"🖼️"),
          h("div",null,h("div",{style:{fontSize:14,fontWeight:500}},file.name),h("div",{style:{fontSize:12,color:"#1E6E3F"}},Math.round(file.size/1024)+" KB — Ready to submit"))
        )
      ),
      h("button",{className:"btn btn-orange",style:{width:"100%"},disabled:!file,onClick:()=>{setPayStatus("pending");setSubmitted(true);}},"Submit Receipt for Review →")
    ),
    method==="deposit"&&submitted&&h("div",null,
      h("div",{className:"alert alert-orange"},"⏳ Receipt submitted! The PTSTI admin team will review your payment. Your certificate will be unlocked once confirmed."),
      h("div",{className:"card"},
        h("div",{style:{fontSize:13,color:"#7A7469",marginBottom:10}}),"Submission summary",
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Student"),h("span",{className:"bv"},student)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Receipt file"),h("span",{className:"bv"},file?.name)),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Status"),h("span",{className:"bv",style:{color:"#C45A15"}},"Pending admin review")),
        h("div",{className:"bank-row"},h("span",{className:"bl"},"Submitted on"),h("span",{className:"bv"},today()))
      )
    )
  );
}

/* ── Certificate ── */
function CertificateView({student,score,finalPassed,payStatus}){
  const [lecName,setLecName]=useState("");
  const [approved,setApproved]=useState(false);

  if(!finalPassed)return h("div",null,
    h("div",{className:"page-title"},"Certificate of Attainment"),
    h("div",{className:"alert alert-orange"},"Complete all modules and pass the Final Test first.")
  );
  if(payStatus!=="paid")return h("div",null,
    h("div",{className:"page-title"},"Certificate of Attainment"),
    h("div",{className:"alert alert-orange"},"💳 Certification fee payment is required before the certificate can be issued. Go to the Payment tab."),
    payStatus==="pending"&&h("div",{className:"alert alert-blue",style:{marginTop:8}},"⏳ Your direct deposit receipt is under review. Certificate will be unlocked once payment is confirmed.")
  );

  return h("div",null,
    h("div",{className:"page-title"},"Certificate of Attainment"),
    h("div",{className:"page-sub"},INSTITUTE+" — Lecturer approval required"),
    h("div",{className:"card",style:{maxWidth:500,marginBottom:24}},
      h("h3",{style:{fontSize:20,fontWeight:700,marginBottom:12}},"Lecturer Approval"),
      h("p",{style:{fontSize:14,color:"#7A7469",marginBottom:14}},"Enter your name below to sign and issue the certificate:"),
      h("input",{className:"fi",placeholder:"Lecturer's full name",value:lecName,onChange:e=>setLecName(e.target.value)}),
      !approved&&h("button",{className:"btn btn-orange",disabled:!lecName.trim(),onClick:()=>setApproved(true)},"✓ Approve & Sign Certificate"),
      approved&&h("div",{className:"alert alert-green"},"✅ Certificate signed by "+lecName),
      approved&&h("button",{className:"btn btn-ghost btn-sm",style:{marginTop:12},onClick:()=>window.print()},"🖨️ Print Certificate")
    ),
    h("div",{className:"cert-wrap"},
      h("div",{className:"cert-inner"}),
      h("div",{className:"cert-seal"},"🏆"),
      h("div",{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,letterSpacing:".18em",textTransform:"uppercase",color:"#7A7469",marginBottom:8}},INSTITUTE.toUpperCase()),
      h("div",{className:"cert-heading"},"Certificate of Attainment"),
      h("div",{style:{fontSize:14,color:"#7A7469",marginBottom:6}}),"This is to certify that",
      h("div",{className:"cert-name"},student),
      h("div",{className:"cert-body"},
        "has successfully completed the ",h("strong",null,"Motor Vehicle Mechanic Trade Course"),
        " at the ",h("strong",null,INSTITUTE),
        ",\ncovering Engine Fundamentals, Fuel Systems, Electrical Systems,\nBrakes & Suspension, and Transmission & Drivetrain.\n\n",
        "Final Assessment Score: ",h("strong",null,score+"%"),
        "\nDate of Issue: ",today(),
        "\nCertification Fee: ",h("strong",null,"Paid ✓")
      ),
      h("div",{style:{marginTop:24}},
        h("div",{className:"sig-line"},approved?lecName:"_____________________"),
        h("div",{className:"sig-sub"},approved?"Lecturer — Motor Vehicle Mechanics, "+SHORT:"Awaiting lecturer signature"),
        !approved&&h("p",{style:{fontSize:12,color:"#E07B39",marginTop:8}},"Awaiting lecturer approval above")
      )
    )
  );
}

/* ── Root App ── */
function App(){
  const [student,setStudent]=useState("");
  const [page,setPage]=useState("dashboard");
  const [modId,setModId]=useState(null);
  const [done,setDone]=useState(new Set());
  const [scores,setScores]=useState({});
  const [finalScore,setFinalScore]=useState(0);
  const [finalPassed,setFinalPassed]=useState(false);
  const [payStatus,setPayStatus]=useState(null);

  if(!student)return h(NameScreen,{onStart:n=>setStudent(n)});

  const pct=Math.round(done.size/MODULES.length*100);
  const allDone=done.size===MODULES.length;

  const go=p=>{
    if(p.startsWith("mod_")){setModId(parseInt(p.slice(4)));setPage("module");}
    else setPage(p);
  };

  let content;
  if(page==="dashboard")content=h(Dashboard,{done,scores,student,pct,finalPassed,payStatus,go});
  else if(page==="module"&&modId)content=h(ModuleView,{
    mod:MODULES.find(m=>m.id===modId),
    onBack:()=>setPage("dashboard"),
    onComplete:(id,sc)=>{setScores(p=>({...p,[id]:sc}));if(sc>=60)setDone(p=>new Set([...p,id]));}
  });
  else if(page==="chat")content=h(ChatView,{student});
  else if(page==="finaltest")content=h(FinalTestView,{done,allDone,onScore:s=>{setFinalScore(s);if(s>=70)setFinalPassed(true);}});
  else if(page==="payment")content=h(PaymentView,{student,finalPassed,finalScore,payStatus,setPayStatus});
  else if(page==="certificate")content=h(CertificateView,{student,score:finalScore,finalPassed,payStatus});

  return h("div",{className:"app-wrap"},
    h(Sidebar,{page,go,done,scores,student,pct,payStatus}),
    h("main",{className:"main"},content)
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
</body>
